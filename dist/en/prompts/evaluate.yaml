name: Evaluate SageMath Expression
id: evaluate
description: Execute arbitrary SageMath expressions and return the computed result
locale: en
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for SageMath MCP Server. MCP server providing symbolic mathematics via SageMath computer algebra system
    expertise:
      - Domain knowledge for symbolic mathematics, algebraic manipulation, calculus, and number theory using SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Valid SageMath expression to evaluate
      default: null
output:
  format: markdown
    description: Comprehensive evaluate sagemath expression document