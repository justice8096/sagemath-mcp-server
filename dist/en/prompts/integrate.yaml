name: Integrate Expression
id: integrate
description: Compute indefinite and definite integrals of mathematical expressions
locale: en
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for SageMath MCP Server. MCP server providing symbolic mathematics via SageMath computer algebra system
    expertise:
      - Domain knowledge for symbolic mathematics, algebraic manipulation, calculus, and number theory using SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expression to integrate (e.g., 'sin(x)')
      default: null
    - name: variable
      type: string
      required: true
      description: Integration variable (e.g., 'x')
      default: null
    - name: lower_limit
      type: string
      required: false
      description: Lower limit for definite integral (leave empty for indefinite)
      default: 
    - name: upper_limit
      type: string
      required: false
      description: Upper limit for definite integral (leave empty for indefinite)
      default: 
    - name: variables
      type: string
      required: false
      description: Other variables to declare (comma-separated)
      default: 
output:
  format: markdown
    description: Comprehensive integrate expression document