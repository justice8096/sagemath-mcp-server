name: Simplifier une Expression
id: simplify
description: Simplifier les expressions mathématiques en utilisant les règles algébriques et les identités trigonométriques
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expression à simplifier
      default: null
    - name: simplification_type
      type: string
      required: false
      description: 'Type de simplification: ''default'', ''full'', ''trig'', ou ''rational'''
      default: default
    - name: variables
      type: string
      required: false
      description: Variables à déclarer (séparées par des virgules)
      default: 
output:
  format: markdown
    description: Comprehensive simplifier une expression document