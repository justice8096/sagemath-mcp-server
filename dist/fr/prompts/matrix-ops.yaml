name: Opérations Matricielles
id: matrix-ops
description: 'Effectuer des opérations matricielles: déterminant, inverse, valeurs propres, rang, RREF'
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: matrix
      type: string
      required: true
      description: Définition de la matrice
      default: null
    - name: operation
      type: string
      required: true
      description: 'Opération: ''determinant'', ''inverse'', ''eigenvalues'', ''rank'', ''rref'', ''transpose'''
      default: determinant
    - name: ring
      type: string
      required: false
      description: Anneau pour les éléments de la matrice
      default: QQ
output:
  format: markdown
    description: Comprehensive opérations matricielles document