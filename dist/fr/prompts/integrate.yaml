name: Intégrer une Expression
id: integrate
description: Calculer les intégrales indéfinies et définies d'expressions mathématiques
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: 'Expression à intégrer (ex: ''sin(x)'')'
      default: null
    - name: variable
      type: string
      required: true
      description: Variable d'intégration
      default: null
    - name: lower_limit
      type: string
      required: false
      description: Limite inférieure pour l'intégrale définie (laisser vide pour indéfinie)
      default: 
    - name: upper_limit
      type: string
      required: false
      description: Limite supérieure pour l'intégrale définie (laisser vide pour indéfinie)
      default: 
    - name: variables
      type: string
      required: false
      description: Autres variables à déclarer (séparées par des virgules)
      default: 
output:
  format: markdown
    description: Comprehensive intégrer une expression document