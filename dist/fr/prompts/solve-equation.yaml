name: Résoudre une Équation
id: solve-equation
description: Résoudre des équations algébriques et transcendantales symboliquement
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: equation
      type: string
      required: true
      description: 'Équation à résoudre (ex: ''x^2 - 4 == 0'')'
      default: null
    - name: variable
      type: string
      required: true
      description: 'Variable à résoudre (ex: ''x'')'
      default: null
    - name: variables
      type: string
      required: false
      description: Autres variables à déclarer (séparées par des virgules)
      default: 
output:
  format: markdown
    description: Comprehensive résoudre une équation document