name: Factoriser une Expression
id: factor
description: Factoriser les polynômes et les expressions entières
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expression ou entier à factoriser
      default: null
    - name: variables
      type: string
      required: false
      description: Variables à déclarer (séparées par des virgules)
      default: 
output:
  format: markdown
    description: Comprehensive factoriser une expression document