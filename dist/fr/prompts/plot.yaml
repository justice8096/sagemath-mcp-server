name: Générer un Graphique Mathématique
id: plot
description: Générer des graphiques de fonctions mathématiques retournant l'image PNG encodée en base64
locale: fr
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Serveur MCP SageMath. Serveur MCP fournissant les mathématiques symboliques via le système d'algèbre informatique SageMath
    expertise:
      - Connaissances du domaine pour les mathématiques symboliques, la manipulation algébrique, le calcul et la théorie des nombres utilisant SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expression à représenter graphiquement
      default: null
    - name: variable
      type: string
      required: false
      description: 'Variable pour l''axe x (default: ''x'')'
      default: x
    - name: x_min
      type: number
      required: false
      description: Valeur minimale de x
      default: -10
    - name: x_max
      type: number
      required: false
      description: Valeur maximale de x
      default: 10
    - name: title
      type: string
      required: false
      description: Titre du graphique (optionnel)
      default: 
output:
  format: markdown
    description: Comprehensive générer un graphique mathématique document