name: Diferenciar Expresión
id: differentiate
description: Calcular derivadas de expresiones matemáticas (parciales, orden superior)
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: 'Expresión a diferenciar (ej: ''x^3 + 2*x'')'
      default: null
    - name: variable
      type: string
      required: true
      description: Variable respecto a la cual diferenciar
      default: null
    - name: order
      type: number
      required: false
      description: 'Orden de diferenciación (default: 1)'
      default: 1
    - name: variables
      type: string
      required: false
      description: Otras variables a declarar (separadas por comas)
      default: 
output:
  format: markdown
    description: Comprehensive diferenciar expresión document