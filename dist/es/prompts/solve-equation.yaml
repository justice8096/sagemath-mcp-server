name: Resolver Ecuación
id: solve-equation
description: Resolver ecuaciones algebraicas y trascendentales simbólicamente
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: equation
      type: string
      required: true
      description: 'Ecuación a resolver (ej: ''x^2 - 4 == 0'')'
      default: null
    - name: variable
      type: string
      required: true
      description: 'Variable a resolver (ej: ''x'')'
      default: null
    - name: variables
      type: string
      required: false
      description: Otras variables a declarar (separadas por comas)
      default: 
output:
  format: markdown
    description: Comprehensive resolver ecuación document