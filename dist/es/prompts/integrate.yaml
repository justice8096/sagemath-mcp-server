name: Integrar Expresión
id: integrate
description: Calcular integrales indefinidas y definidas de expresiones matemáticas
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: 'Expresión a integrar (ej: ''sin(x)'')'
      default: null
    - name: variable
      type: string
      required: true
      description: Variable de integración
      default: null
    - name: lower_limit
      type: string
      required: false
      description: Límite inferior para integral definida (dejar vacío para indefinida)
      default: 
    - name: upper_limit
      type: string
      required: false
      description: Límite superior para integral definida (dejar vacío para indefinida)
      default: 
    - name: variables
      type: string
      required: false
      description: Otras variables a declarar (separadas por comas)
      default: 
output:
  format: markdown
    description: Comprehensive integrar expresión document