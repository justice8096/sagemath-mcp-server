name: Evaluar Expresión de SageMath
id: evaluate
description: Ejecutar expresiones arbitrarias de SageMath y retornar el resultado computado
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expresión válida de SageMath a evaluar
      default: null
output:
  format: markdown
    description: Comprehensive evaluar expresión de sagemath document