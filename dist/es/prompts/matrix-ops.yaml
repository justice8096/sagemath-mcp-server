name: Operaciones Matriciales
id: matrix-ops
description: 'Realizar operaciones matriciales: determinante, inversa, valores propios, rango, RREF'
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: matrix
      type: string
      required: true
      description: Definición de matriz
      default: null
    - name: operation
      type: string
      required: true
      description: 'Operación: ''determinant'', ''inverse'', ''eigenvalues'', ''rank'', ''rref'', ''transpose'''
      default: determinant
    - name: ring
      type: string
      required: false
      description: Anillo para elementos de matriz
      default: QQ
output:
  format: markdown
    description: Comprehensive operaciones matriciales document