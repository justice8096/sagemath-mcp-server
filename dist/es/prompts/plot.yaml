name: Generar Gráfico Matemático
id: plot
description: Generar gráficos de funciones matemáticas retornando imagen PNG codificada en base64
locale: es
models:
  - gpt-4
    - gpt-4-turbo
    - claude-3-opus
    - claude-3-sonnet
    - claude-3.5-sonnet
context:
  role: You are an expert assistant for Servidor MCP de SageMath. Servidor MCP que proporciona matemática simbólica mediante el sistema de álgebra computacional SageMath
    expertise:
      - Conocimiento de dominio para matemática simbólica, manipulación algebraica, cálculo y teoría de números usando SageMath
parameters:
  - name: expression
      type: string
      required: true
      description: Expresión a graficar
      default: null
    - name: variable
      type: string
      required: false
      description: 'Variable para eje x (default: ''x'')'
      default: x
    - name: x_min
      type: number
      required: false
      description: Valor mínimo de x
      default: -10
    - name: x_max
      type: number
      required: false
      description: Valor máximo de x
      default: 10
    - name: title
      type: string
      required: false
      description: Título del gráfico (opcional)
      default: 
output:
  format: markdown
    description: Comprehensive generar gráfico matemático document