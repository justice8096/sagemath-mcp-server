name: Release

# Publishes to npm with trusted publishing (OIDC). No npm token is stored.
# One-time setup on npmjs.com: package Settings -> Trusted Publisher ->
# GitHub Actions, with user justice8096, repository sagemath-mcp-server and
# workflow filename release.yml.

on:
  push:
    tags: ['v*']
  # Lets a failed publish be repeated from the Actions tab without moving a tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for npm trusted publishing

jobs:
  release:
    # Publish only from a version tag. A manual run must pick a v* tag under
    # "Use workflow from"; a run started from a branch is skipped.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --access public
