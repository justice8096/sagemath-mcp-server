version: "3.8"

services:
  sagemath-mcp:
    build: .
    container_name: sagemath-mcp-server
    restart: unless-stopped
    environment:
      - TRANSPORT=${TRANSPORT:-stdio}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    stdin_open: true
    volumes:
      - sage-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sage-data:
