version: "3.8"

services:
  sagemath-mcp:
    build: .
    container_name: sagemath-mcp-server
    restart: unless-stopped
    environment:
      - TRANSPORT=${TRANSPORT:-stdio}
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Only used when TRANSPORT=http, which will not start without API_KEY.
      - HOST=${HOST:-0.0.0.0}
      - API_KEY=${API_KEY:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    stdin_open: true
    volumes:
      - sage-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sage-data:
