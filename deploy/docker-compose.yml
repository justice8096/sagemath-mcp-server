version: "3.8"

services:
  sagemath-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Published on the Docker host's loopback interface only. To expose the
      # service to other machines set BIND_ADDRESS=0.0.0.0 and put TLS in
      # front of it.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      - TRANSPORT=http
      - HOST=0.0.0.0
      - PORT=3000
      - SAGE_TIMEOUT=${SAGE_TIMEOUT:-120000}
      - SAGE_LOCALE=${SAGE_LOCALE:-en}
      # Required. Compose stops here if it is missing; the server also
      # refuses to start without it. Example: openssl rand -hex 32
      - API_KEY=${API_KEY:?Set API_KEY to a random secret of at least 16 characters}
    volumes:
      - sage-tmp:/tmp
    # Run a small init as PID 1 so finished SageMath helper processes are
    # reaped instead of piling up as zombies.
    init: true
    restart: unless-stopped
    networks:
      - sagemath-network

volumes:
  sage-tmp:

networks:
  sagemath-network:
    driver: bridge
